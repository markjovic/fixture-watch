# .github/workflows/fixture-watch.yml
#
# ⚠️ NO actions/setup-node IN ANY JOB HERE. They call api.playhq.com, and setup-node
# changes the runner's outbound fingerprint so CloudFront 403s every request,
# session acquisition included. The runner's preinstalled Node is used instead.
#
# ─── THE CRON IS A STARTER, NOT THE CLOCK ───────────────────────────────────
# MEASURED ON THIS REPO:
#   2026-11-15/16  `7,37 * * * *` delivered TWO fires out of an expected EIGHTEEN
#                  overnight, one at 02:51 — neither :07 nor :37.
#   2026-11-17     a single daily `45 19 * * *` fire was NOT delivered at all.
# GitHub's scheduler drops fires. Assume any individual fire will not arrive.
#
# OBSERVED DELIVERY, 2026-11-15 → 17 — and the number that matters is the RATIO:
#   half-hourly cron (~48 requests/day)  → 2, then 3 fires delivered
#   single daily cron (1 request/day)    → 0 fires delivered
# Only a small fraction of requested fires arrive, so HOW OFTEN A WORKFLOW ASKS is
# what decides whether it ever runs. A workflow that asks once a day mostly gets
# nothing. This is why the watchdog kept firing while this workflow did not: it had
# forty-eight tickets and this had one. It was never about which workflow GitHub
# preferred.
#
#   ⚠️ WE DO NOT NEED A FIRE AT 07:00. WE NEED ONE FIRE, AT ANY HOUR —
#      SO ASK AS OFTEN AS POSSIBLE AND MAKE THE EXTRA FIRES FREE.
#
# The leg chain covers from wherever it starts through to 22:00, and a leg whose end
# time has already passed exits immediately with zero passes and hands on — so a
# chain started at 14:45 simply begins at leg 3.
#
# So the starter cron is HALF-HOURLY, and the guard below makes every fire after the
# first one of the day a ~20-second no-op. An earlier version used one daily starter,
# then eight; both were far too few at this delivery rate.
#
# ⚠️ THE STAND-DOWN GUARD IS WHAT MAKES MULTIPLE STARTERS SAFE. Without it the
# second fire would start a SECOND full chain alongside the first, and the two would
# race each other's state commits all day. The guard applies ONLY to `schedule`
# runs: a manual dispatch is always deliberate and always proceeds.
#
# ⚠️ LEGS 2–4 ALSO CHECK leg1's `proceed` OUTPUT. They run on `always()`, so without
# that condition a leg1 that stood down would still be followed by three legs
# starting their own daemons. They take `needs: [leg1, <previous>]` so they can read
# leg1's output while keeping the chain in order.
#
# ─── WHY FOUR LEGS ──────────────────────────────────────────────────────────
# A job is capped at 6 hours (https://docs.github.com/en/actions/reference/limits)
# and the active day is 15 hours. Four legs chained with `needs:` live in ONE
# workflow run — capped at 35 days — so nothing is dispatched between them: no PAT,
# no chain to lose. Each leg has a Melbourne WALL-CLOCK end time, not a duration, so
# a late start costs that leg and never pushes the day sideways.
#
# ⚠️ Later legs run on `always() && !cancelled()`. A failed leg must not cost the
# rest of the day; `!cancelled()` is what still lets a human stop the run by
# cancelling it. NEVER change this to `success()`.
#
# ─── DAYLIGHT SAVING ────────────────────────────────────────────────────────
# GitHub cron is UTC and the starter fires round the clock, so DST never needs to be
# computed: the guard asks the Melbourne clock whether this is a sensible moment to
# start a day, leg 1 sleeps to 07:00 when it starts early, and any leg whose end time
# has passed exits immediately. There is no DST arithmetic anywhere.

name: Fixture Watch

on:
  schedule:
    # Ask every half hour, all day. Only a fraction of these are ever delivered, and
    # the guard makes every one after the day's first a ~20-second no-op.
    # :08 and :38 rather than :00/:30, where the scheduler is most congested.
    - cron: '8,38 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Every pass writes nothing, commits nothing, and prints alerts instead of sending them'
        required: false
        default: false
        type: boolean
      interval:
        description: 'Minutes between passes'
        required: false
        default: '30'
        type: string
      single_leg:
        description: 'Run leg 1 only, ending at 22:00. For testing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read          # the stand-down guard reads this workflow's own run list

# NOTE: NO `concurrency` GROUP, DELIBERATELY. A group would queue a second starter
# behind a fifteen-hour run instead of letting it stand down, and a queued run can be
# evicted by the next arrival. It would also make the watchdog queue rather than
# exit. The explicit guard below is the interlock.

jobs:
  leg1:
    name: until 10:00
    runs-on: ubuntu-latest
    timeout-minutes: 350
    outputs:
      proceed: ${{ steps.guard.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stand down if another run is already covering today
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch — proceeding without checking for other runs."
            exit 0
          fi
          OTHERS=$(gh run list --workflow=fixture-watch.yml --limit=30 \
                     --json databaseId,status \
                     --jq '[.[] | select(.status=="in_progress" or .status=="queued" or .status=="waiting") | select(.databaseId != ${{ github.run_id }})] | length')
          echo "other active runs of this workflow: $OTHERS"
          if [ "$OTHERS" != "0" ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Another run is already covering today — standing down."
            exit 0
          fi
          # ⚠️ A FIRE OUTSIDE THE DAY MUST NOT START A CHAIN. Leg 1 sleeps until
          # 07:00 Melbourne, so a fire at 01:00 would sit burning a runner for five
          # and a half hours and achieve nothing before its budget cut it off. From
          # 05:00 the wait is short enough to be worth it; after 21:30 there is no
          # pass left to make today.
          MIN=$(node -e "console.log(require('./scripts/lib/schedule-gate.cjs').melbourneMinutes())")
          echo "Melbourne minutes since midnight: $MIN (start window is 300–1290)"
          if [ "$MIN" -lt 300 ] || [ "$MIN" -ge 1290 ]; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Outside the 05:00–21:30 start window — standing down."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "No other run active and inside the start window — this one takes the day."
          fi

      - name: Node version (preinstalled — setup-node is forbidden here)
        if: steps.guard.outputs.proceed == 'true'
        run: node --version

      - name: Configure git
        if: steps.guard.outputs.proceed == 'true'
        run: |
          git config user.name  "fixture-watch[bot]"
          git config user.email "fixture-watch@users.noreply.github.com"

      - name: Watch
        if: steps.guard.outputs.proceed == 'true'
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
          # Fast publish on FINAL (2026-11-23). A PAT with actions:write on
          # markjovic/sports-players-stats — GITHUB_TOKEN cannot create a run in
          # another repository. ⚠ ABSENT MEANS OFF: with no secret the watcher
          # logs "publish-on-FINAL is configured but INACTIVE" and behaves exactly
          # as it did before. It must be on EVERY step that runs the watcher,
          # including the watchdog's, or a watchdog-only day dispatches nothing
          # and says so only in a log nobody reads.
          STATTRACK_DISPATCH_TOKEN: ${{ secrets.STATTRACK_DISPATCH_TOKEN }}
        run: |
          set -o pipefail
          INTERVAL='${{ inputs.interval }}'
          if [ -z "$INTERVAL" ]; then INTERVAL='30'; fi
          UNTIL='10:00'
          if [ "${{ inputs.single_leg }}" = "true" ]; then UNTIL='22:00'; fi
          PASS=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then PASS='--dry-run'; fi
          node scripts/fixture-watch-daemon.js --until="$UNTIL" --interval="$INTERVAL" --budget-min=330 --pass-args="$PASS"

  leg2:
    name: until 14:00
    needs: [leg1]
    if: ${{ always() && !cancelled() && needs.leg1.outputs.proceed == 'true' && inputs.single_leg != true && inputs.single_leg != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node version (preinstalled — setup-node is forbidden here)
        run: node --version
      - name: Configure git
        run: |
          git config user.name  "fixture-watch[bot]"
          git config user.email "fixture-watch@users.noreply.github.com"
      - name: Watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
          # Fast publish on FINAL (2026-11-23). A PAT with actions:write on
          # markjovic/sports-players-stats — GITHUB_TOKEN cannot create a run in
          # another repository. ⚠ ABSENT MEANS OFF: with no secret the watcher
          # logs "publish-on-FINAL is configured but INACTIVE" and behaves exactly
          # as it did before. It must be on EVERY step that runs the watcher,
          # including the watchdog's, or a watchdog-only day dispatches nothing
          # and says so only in a log nobody reads.
          STATTRACK_DISPATCH_TOKEN: ${{ secrets.STATTRACK_DISPATCH_TOKEN }}
        run: |
          set -o pipefail
          INTERVAL='${{ inputs.interval }}'
          if [ -z "$INTERVAL" ]; then INTERVAL='30'; fi
          PASS=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then PASS='--dry-run'; fi
          node scripts/fixture-watch-daemon.js --until=14:00 --interval="$INTERVAL" --budget-min=330 --pass-args="$PASS"

  leg3:
    name: until 18:00
    needs: [leg1, leg2]
    if: ${{ always() && !cancelled() && needs.leg1.outputs.proceed == 'true' && inputs.single_leg != true && inputs.single_leg != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node version (preinstalled — setup-node is forbidden here)
        run: node --version
      - name: Configure git
        run: |
          git config user.name  "fixture-watch[bot]"
          git config user.email "fixture-watch@users.noreply.github.com"
      - name: Watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
          # Fast publish on FINAL (2026-11-23). A PAT with actions:write on
          # markjovic/sports-players-stats — GITHUB_TOKEN cannot create a run in
          # another repository. ⚠ ABSENT MEANS OFF: with no secret the watcher
          # logs "publish-on-FINAL is configured but INACTIVE" and behaves exactly
          # as it did before. It must be on EVERY step that runs the watcher,
          # including the watchdog's, or a watchdog-only day dispatches nothing
          # and says so only in a log nobody reads.
          STATTRACK_DISPATCH_TOKEN: ${{ secrets.STATTRACK_DISPATCH_TOKEN }}
        run: |
          set -o pipefail
          INTERVAL='${{ inputs.interval }}'
          if [ -z "$INTERVAL" ]; then INTERVAL='30'; fi
          PASS=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then PASS='--dry-run'; fi
          node scripts/fixture-watch-daemon.js --until=18:00 --interval="$INTERVAL" --budget-min=330 --pass-args="$PASS"

  leg4:
    name: until 22:00
    needs: [leg1, leg3]
    if: ${{ always() && !cancelled() && needs.leg1.outputs.proceed == 'true' && inputs.single_leg != true && inputs.single_leg != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node version (preinstalled — setup-node is forbidden here)
        run: node --version
      - name: Configure git
        run: |
          git config user.name  "fixture-watch[bot]"
          git config user.email "fixture-watch@users.noreply.github.com"
      - name: Watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
          # Fast publish on FINAL (2026-11-23). A PAT with actions:write on
          # markjovic/sports-players-stats — GITHUB_TOKEN cannot create a run in
          # another repository. ⚠ ABSENT MEANS OFF: with no secret the watcher
          # logs "publish-on-FINAL is configured but INACTIVE" and behaves exactly
          # as it did before. It must be on EVERY step that runs the watcher,
          # including the watchdog's, or a watchdog-only day dispatches nothing
          # and says so only in a log nobody reads.
          STATTRACK_DISPATCH_TOKEN: ${{ secrets.STATTRACK_DISPATCH_TOKEN }}
        run: |
          set -o pipefail
          INTERVAL='${{ inputs.interval }}'
          if [ -z "$INTERVAL" ]; then INTERVAL='30'; fi
          PASS=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then PASS='--dry-run'; fi
          node scripts/fixture-watch-daemon.js --until=22:00 --interval="$INTERVAL" --budget-min=330 --pass-args="$PASS"
