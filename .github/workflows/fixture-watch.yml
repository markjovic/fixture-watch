# .github/workflows/fixture-watch.yml
#
# ⚠️ NO actions/setup-node IN ANY JOB HERE. They call api.playhq.com, and setup-node
# changes the runner's outbound fingerprint so CloudFront 403s every request,
# session acquisition included. The runner's preinstalled Node is used instead.
#
# ─── THE CRON IS A STARTER, NOT THE CLOCK ───────────────────────────────────
# MEASURED 2026-11-15/16 on this repo: a `7,37 * * * *` schedule delivered TWO fires
# out of an expected EIGHTEEN overnight, one of them at 02:51 — neither :07 nor :37.
# GitHub drops most fires on a high-frequency cron. So this now fires ONCE a day and
# the job itself keeps the cadence, checking every 30 minutes from inside a
# long-running process (scripts/fixture-watch-daemon.js).
#
# ─── WHY FOUR JOBS ──────────────────────────────────────────────────────────
# A job is capped at 6 hours (https://docs.github.com/en/actions/reference/limits)
# and the active day is 15 hours. Four legs chained with `needs:` live in ONE
# workflow run — which is capped at 35 days — so nothing is dispatched between them:
# no PAT, no chain to lose, nothing that can silently fail and leave the day dead.
# Each leg is given a Melbourne WALL-CLOCK end time rather than a duration, so a
# late start costs that leg time and never pushes the whole day sideways.
#
# ⚠️ EVERY LATER LEG RUNS ON `always() && !cancelled()`. A failed leg must not cost
# the rest of the day; `!cancelled()` is what still lets you stop everything by
# cancelling the run. Do NOT change this to `success()`.
#
# ─── DAYLIGHT SAVING ────────────────────────────────────────────────────────
# GitHub cron is UTC. 19:45 UTC is 06:45 in Melbourne during AEDT and 05:45 during
# AEST. Leg 1 sleeps until 07:00 Melbourne either way, so the shift costs nothing
# and there is no DST arithmetic anywhere.

name: Fixture Watch

on:
  schedule:
    # 19:45 UTC daily = 06:45 AEDT / 05:45 AEST. Deliberately off the hour and half
    # hour, where GitHub's scheduler is most congested.
    - cron: '45 19 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Every pass writes nothing, commits nothing, and prints alerts instead of sending them'
        required: false
        default: false
        type: boolean
      interval:
        description: 'Minutes between passes'
        required: false
        default: '30'
        type: string
      single_leg:
        description: 'Run leg 1 only, ending at 22:00. For testing.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# NOTE: NO `concurrency` GROUP, DELIBERATELY. A group would make the watchdog
# workflow QUEUE behind a five-hour leg instead of standing down, and a queued run
# can be evicted by the next arrival. The watchdog checks for a running daemon
# itself and exits.

jobs:
  leg1:
    name: until 10:00
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node version (preinstalled — setup-node is forbidden here)
        run: node --version
      - name: Configure git
        run: |
          git config user.name  "fixture-watch[bot]"
          git config user.email "fixture-watch@users.noreply.github.com"
      - name: Watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
        run: |
          set -o pipefail
          INTERVAL='${{ inputs.interval }}'
          if [ -z "$INTERVAL" ]; then INTERVAL='30'; fi
          UNTIL='10:00'
          if [ "${{ inputs.single_leg }}" = "true" ]; then UNTIL='22:00'; fi
          PASS=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then PASS='--dry-run'; fi
          node scripts/fixture-watch-daemon.js --until="$UNTIL" --interval="$INTERVAL" --budget-min=330 --pass-args="$PASS"

  leg2:
    name: until 14:00
    needs: leg1
    if: ${{ always() && !cancelled() && inputs.single_leg != true && inputs.single_leg != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node version (preinstalled — setup-node is forbidden here)
        run: node --version
      - name: Configure git
        run: |
          git config user.name  "fixture-watch[bot]"
          git config user.email "fixture-watch@users.noreply.github.com"
      - name: Watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
        run: |
          set -o pipefail
          INTERVAL='${{ inputs.interval }}'
          if [ -z "$INTERVAL" ]; then INTERVAL='30'; fi
          PASS=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then PASS='--dry-run'; fi
          node scripts/fixture-watch-daemon.js --until=14:00 --interval="$INTERVAL" --budget-min=330 --pass-args="$PASS"

  leg3:
    name: until 18:00
    needs: leg2
    if: ${{ always() && !cancelled() && inputs.single_leg != true && inputs.single_leg != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node version (preinstalled — setup-node is forbidden here)
        run: node --version
      - name: Configure git
        run: |
          git config user.name  "fixture-watch[bot]"
          git config user.email "fixture-watch@users.noreply.github.com"
      - name: Watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
        run: |
          set -o pipefail
          INTERVAL='${{ inputs.interval }}'
          if [ -z "$INTERVAL" ]; then INTERVAL='30'; fi
          PASS=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then PASS='--dry-run'; fi
          node scripts/fixture-watch-daemon.js --until=18:00 --interval="$INTERVAL" --budget-min=330 --pass-args="$PASS"

  leg4:
    name: until 22:00
    needs: leg3
    if: ${{ always() && !cancelled() && inputs.single_leg != true && inputs.single_leg != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node version (preinstalled — setup-node is forbidden here)
        run: node --version
      - name: Configure git
        run: |
          git config user.name  "fixture-watch[bot]"
          git config user.email "fixture-watch@users.noreply.github.com"
      - name: Watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER:  ${{ secrets.PUSHOVER_USER }}
        run: |
          set -o pipefail
          INTERVAL='${{ inputs.interval }}'
          if [ -z "$INTERVAL" ]; then INTERVAL='30'; fi
          PASS=''
          if [ "${{ inputs.dry_run }}" = "true" ]; then PASS='--dry-run'; fi
          node scripts/fixture-watch-daemon.js --until=22:00 --interval="$INTERVAL" --budget-min=330 --pass-args="$PASS"
